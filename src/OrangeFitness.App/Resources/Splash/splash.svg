<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Orange Fitness: dumbbell with a "booked" check badge -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <g fill="#FFFFFF">
        <!-- bar -->
        <rect x="100" y="188" width="256" height="24" rx="6" />
        <!-- left plates -->
        <rect x="64" y="148" width="30" height="104" rx="10" />
        <rect x="98" y="118" width="38" height="164" rx="12" />
        <!-- right plates -->
        <rect x="320" y="118" width="38" height="164" rx="12" />
        <rect x="362" y="148" width="30" height="104" rx="10" />
    </g>
    <!-- check badge (orange ring separates it from the plates) -->
    <circle cx="330" cy="322" r="86" fill="#F57C00" />
    <circle cx="330" cy="322" r="72" fill="#FFFFFF" />
    <path d="M 296 324 L 320 348 L 366 300" fill="none" stroke="#F57C00" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
